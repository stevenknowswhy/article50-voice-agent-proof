name: Guardrails

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.1
      - name: Run guardrail tests
        run: python -m pytest -q
      - name: Run lint
        run: python -m ruff check .
